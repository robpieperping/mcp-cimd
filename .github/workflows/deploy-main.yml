name: Build And Deploy (main)

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

env:
  # GHCR, so the push needs no credential beyond the workflow's own
  # GITHUB_TOKEN. github.repository is already lowercase, which GHCR
  # requires.
  IMAGE: ghcr.io/${{ github.repository }}
  K8S_NAMESPACE: ${{ secrets.K8S_NAMESPACE }}
  K8S_DEPLOYMENT: mcp-cimd
  K8S_CONTAINER: mcp

jobs:
  # Gate the image push on the code actually compiling. Without this a
  # broken build reaches the cluster and is diagnosed as a deploy problem.
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Builds, then runs the authorization suite against the real express
      # app. A regression here means the server would serve FHIR data to an
      # unaudienced token, so it gates the image rather than the deploy.
      - name: Test
        run: npm test

  build-and-push:
    runs-on: ubuntu-24.04-arm
    needs: check
    permissions:
      contents: read
      packages: write
    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tags
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          # The SE DevOps cluster is all Graviton (r7g.xlarge, arm64),
          # verified 2026-09-10. Building amd64 here would produce an
          # image the cluster cannot run, and the symptom -- "exec format
          # error" in CrashLoopBackOff -- reads like an application bug.
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.vars.outputs.sha_short }}
            ${{ env.IMAGE }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Without this the job fails inside kubectl, which falls back to
      # localhost:8080 and reports "failed to download openapi" -- a message
      # that says nothing about the actual cause.
      - name: Check deploy secrets are present
        run: |
          missing=
          [ -n "${{ secrets.K8S_NAMESPACE }}" ] || missing="$missing K8S_NAMESPACE"
          [ -n "${{ secrets.KUBE_CONFIG_B64 }}" ] || missing="$missing KUBE_CONFIG_B64"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. Run ./infra/k8s/bootstrap.sh --apply"
            exit 1
          fi

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG_B64 }}" | base64 --decode > "$HOME/.kube/config"

      - name: Apply manifests
        run: kubectl apply -n "$K8S_NAMESPACE" -f infra/k8s/k8s.yaml

      - name: Roll out latest image
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:${{ needs.build-and-push.outputs.sha_short }}"
          kubectl set image -n "$K8S_NAMESPACE" deployment/${K8S_DEPLOYMENT} ${K8S_CONTAINER}="${IMAGE}"
          kubectl rollout status -n "$K8S_NAMESPACE" deployment/${K8S_DEPLOYMENT} --timeout=180s
