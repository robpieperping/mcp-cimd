# mcp-cimd on the Ping SE DevOps cluster.
#
# Namespace is NOT hardcoded: select it first with
#   kubens ping-devops-robpieper
# then
#   kubectl apply -f infra/k8s/k8s.yaml
#
# Prerequisites (created once, imperatively; see infra/k8s/README.md):
#   kubectl create secret generic mcp-cimd-secrets ...
#
# There is no imagePullSecret: the GHCR package is public, so the
# cluster pulls anonymously. Making the package private again means
# adding a docker-registry secret here and in the pod spec.
#
# This server is its own OAuth 2.1 protected resource (plan §3): it
# validates ChatGPT's bearer token itself rather than sitting behind
# PingGateway. ChatGPT therefore has to reach it from the internet, and
# the token validation in src/mcp-auth.ts is the only thing between the
# internet and SmileCDR -- which is why MCP_AUTH defaults to "required"
# and why the mutating tools are off by default.
#
# The Ingress on mcp-cimd.ping-devops.com is Phase C, not here. Until it
# exists this is still a ClusterIP service, reachable by port-forward.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-cimd
  labels:
    app: mcp-cimd
spec:
  # MCP sessions live in memory, keyed by Mcp-Session-Id (see src/http.ts).
  # A second pod would answer follow-up requests for sessions it never saw,
  # which surfaces as intermittent "Session not found" 404s. One replica
  # until there is either a shared session store or sticky sessions, and
  # Recreate so a rollout never briefly runs two.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mcp-cimd
  template:
    metadata:
      labels:
        app: mcp-cimd
    spec:
      containers:
        - name: mcp
          # Tracks latest so a rollout restart ships updates without a
          # manifest edit; CI also pushes a git-sha tag for rollback and
          # sets the deployment to that sha on every deploy.
          image: ghcr.io/robpieperping/mcp-cimd:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: MCP_TRANSPORT
              value: "http"
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: "production"
            # Inbound authorization. Not secrets -- all three are public
            # identifiers, and MCP_RESOURCE is published in this server's
            # own protected-resource metadata. They live here rather than
            # in the Secret so a change is visible in a diff.
            #
            # MCP_RESOURCE must be byte-identical to the Audience Claim
            # Value on the PingFederate access token manager and to the
            # `resource` ChatGPT sends. A trailing slash here is a 401
            # with no other symptom.
            - name: MCP_RESOURCE
              value: "https://mcp-cimd.ping-devops.com/mcp"
            - name: OAUTH_ISSUER
              value: "https://facile-pastrami-lipogram.ping-devops.com"
            # read hides the six mutating FHIR tools outright (plan §6.2).
            - name: MCP_TOOLSET
              value: "read"
            # Phase A's CIMD client document, served from this origin because
            # a CIMD client_id *is* its document's URL and the PF host is not
            # ours to write to. Test-only: drop this and the Ingress path once
            # a real client exists. See src/test-client-doc.ts.
            - name: SERVE_TEST_CLIENT_DOC
              value: "true"
            # Not a secret, and never was: the server logs it at startup and
            # /readyz reports it. It sat in the namespace Secret, whose only
            # key it was, which made every change to it an opaque edit to a
            # Secret instead of a visible one in a diff.
            #
            # Kubernetes gives `env` precedence over `envFrom`, so this wins
            # over the Secret's stale copy of the same key. That copy is now
            # vestigial and can be dropped from the Secret.
            - name: FHIR_BASE_URL
              value: "https://uhgc-smilecdr.encore.pingidentity.com/fhir"
          envFrom:
            # PINGONE_ENV_ID, PINGONE_CLIENT_ID, PINGONE_CLIENT_SECRET --
            # the outbound service account, which genuinely is secret and is
            # optional (absent means the FHIR hop is anonymous).
            - secretRef:
                name: mcp-cimd-secrets
          # Both probes use /healthz, which never touches FHIR. /readyz
          # DOES call the FHIR server and is the better-looking readiness
          # probe, but wiring it here would pull the pod out of the
          # Service whenever FHIR hiccups -- turning a clear tool-level
          # error into an opaque 503 from the gateway. /readyz stays a
          # diagnostic you curl by hand.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 4
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            # runAsUser is REQUIRED alongside runAsNonRoot, not optional.
            # The kubelet verifies non-rootness from the numeric UID, and
            # a Dockerfile USER given as a name is invisible to it:
            # omitting this fails the pod with CreateContainerConfigError
            # "image has non-numeric user (node), cannot verify user is
            # non-root". 1000 is the node user the image already runs as,
            # and infra/Dockerfile states it numerically to match.
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-cimd
spec:
  type: ClusterIP
  selector:
    app: mcp-cimd
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-cimd
  annotations:
    # MCP's GET /mcp is an SSE stream. nginx buffers proxied responses by
    # default, which holds events until the buffer fills and makes the
    # stream look dead; the long timeouts stop it cutting an idle stream.
    # Learned the hard way in Phase 4 of the earlier program.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # express accepts a 4mb JSON body (src/http.ts). nginx's default cap is
    # 1m, so without this a large transaction Bundle is rejected at the
    # ingress with a 413 that never reaches the server's own limit.
    nginx.ingress.kubernetes.io/proxy-body-size: "4m"
spec:
  ingressClassName: nginx-public
  # No secretName: hosts under ping-devops.com automatically get the
  # cluster's wildcard Let's Encrypt certificate.
  tls:
    - hosts:
        - mcp-cimd.ping-devops.com
  rules:
    - host: mcp-cimd.ping-devops.com
      http:
        # Only what a client needs, rather than the usual path: / .
        #
        # /healthz and /readyz are deliberately NOT routed. They are
        # unauthenticated by design, because kubelet probes must not need a
        # token -- and the kubelet reaches the pod directly, so it does not
        # need the Ingress. /readyz in particular reports the FHIR server's
        # base URL, which is not something to hand to the internet.
        paths:
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: mcp-cimd
                port:
                  number: 80
          # Covers both the bare path and the RFC 9728 path-suffixed form
          # (/.well-known/oauth-protected-resource/mcp).
          - path: /.well-known/oauth-protected-resource
            pathType: Prefix
            backend:
              service:
                name: mcp-cimd
                port:
                  number: 80
          # Test-only, paired with SERVE_TEST_CLIENT_DOC on the Deployment.
          - path: /mcp-test-client.json
            pathType: Exact
            backend:
              service:
                name: mcp-cimd
                port:
                  number: 80
          # Where the authorization response lands. Deliberately ours: the
          # PF host's /callback performs the token exchange itself and spends
          # the code with the wrong verifier.
          - path: /callback
            pathType: Exact
            backend:
              service:
                name: mcp-cimd
                port:
                  number: 80
